name: Verify DecisionForge

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests and coverage
        run: pytest --cov=decisionforge --cov-fail-under=95 --cov-report=term-missing
      - name: Build distributable
        run: python -m build
      - name: Real HTTP acceptance demo
        run: python scripts/demo.py --output work/live-demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            dist/*
            work/live-demo.json

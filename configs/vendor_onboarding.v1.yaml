workflow_id: vendor_onboarding
version: 1
description: Vendor registration with documents and country risk checks
input_schema:
  type: object
  additionalProperties: false
  required: [vendor_id, country, documents, annual_spend]
  properties:
    vendor_id: {type: string, minLength: 1, maxLength: 100}
    country: {type: string, enum: [IN, US, GB, OTHER]}
    documents: {type: boolean}
    annual_spend: {type: number, minimum: 0, maximum: 1000000000}
    simulation:
      type: object
      additionalProperties: false
      properties:
        fail_until: {type: integer, minimum: 0, maximum: 10}
        permanent_failure: {type: boolean}
        verified: {type: boolean}
        risk_score: {type: integer, minimum: 0, maximum: 100}
start: documents
retry: {max_attempts: 2, base_delay_seconds: 2, max_delay_seconds: 10}
stages:
  documents:
    type: rules
    rules:
      - id: documents_missing
        description: Registration documents are required
        condition: {field: input.documents, op: eq, value: false}
        on_match: rejected
    default: verification
  verification:
    type: dependency
    adapter: simulated_verification
    next: assessment
    on_failure: review
  assessment:
    type: rules
    rules:
      - id: verification_failed
        description: Verification must succeed
        condition: {field: dependencies.verification.verified, op: eq, value: false}
        on_match: rejected
      - id: enhanced_due_diligence
        description: Unlisted countries or large contracts require review
        condition:
          any:
            - {field: input.country, op: not_in, value: [IN, US, GB]}
            - {field: input.annual_spend, op: gt, value: 500000}
        on_match: review
    default: approved
  review:
    type: manual
    reason: Enhanced vendor due diligence or verification outage
    decisions: {approve: approved, reject: rejected}
  approved:
    type: terminal
    outcome: APPROVED
    reason: Vendor meets configured requirements or reviewer approved
  rejected:
    type: terminal
    outcome: REJECTED
    reason: Vendor failed a mandatory rule or reviewer rejected
